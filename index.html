<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Matcha People - Ari</title>

<!-- Home-screen app behavior on iPad -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Matcha People" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#F8F2E0" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%235C8A4C'/%3E%3Cpath d='M60 24c14 10 22 26 22 42a22 22 0 0 1-44 0c0-16 8-32 22-42z' fill='%23F8F2E0'/%3E%3Cpath d='M60 40v56' stroke='%235C8A4C' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#F8F2E0; --bg-alt:#F1E8CE; --card:#FFFDF6; --card-border:#E3D6B4;
    --card-low:#FBEAEC; --card-low-border:#E4A7AF;
    --input:#FFFDF6; --input-border:#DCCEA0;
    --text:#573F20; --text-dim:#8A6B44; --text-faint:#A6895F;
    --red:#C91F37; --red-bg:#F6D7DB; --red-bg-soft:#FBEAEC; --red-border:#E4A7AF;
    --teal:#4B7A3E; --teal-bg:#E4EEDA; --teal-strong:#5C8A4C;
    --coral:#B5652E; --coral-bg:#F3E2CE;
    --amber:#B5842A; --amber-bg:#F5E9CC; --amber-border:#DFC486;
    --link:#C9662A; --link-bg:#F6E1CC;
    --line:#2F8F4E; --line-bg:#DFEEE1;
    --modal-bg:#FFFDF6; --modal-border:#E3D6B4; --divider:#EAE0C2;
    --cat-prep:#F5E4A8; --cat-cashier:#C99A3D; --cat-bar:#F1EEE6; --cat-s2:#F6D3D8;
    --item-cat-ingredients:#DCE9CE; --item-cat-packing:#F6DFC2; --item-cat-other:#EAE0C2;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh; padding-bottom:164px;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  input::placeholder{color:var(--text-faint);}
  ::-webkit-scrollbar{display:none;}

  .icon{display:inline-flex; align-items:center; justify-content:center;}
  .icon svg{display:block;}

  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--divider);
    padding:24px 20px 16px;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  h1{font-size:24px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .subtitle{font-size:11px; color:var(--text-faint); margin:2px 0 0; letter-spacing:0.05em;}
  .low-badge{
    display:flex; align-items:center; gap:6px;
    background:var(--red-bg); color:var(--red);
    padding:8px 12px; border-radius:999px; font-weight:600; font-size:14px;
  }
  .search-wrap{position:relative;}
  .search-wrap .icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
  #search{
    width:100%; background:var(--bg-alt); border:1px solid var(--input-border);
    border-radius:12px; padding:12px 16px 12px 40px; font-size:15px; color:var(--text);
    outline:none;
  }

  /* Low stock strip */
  #lowStrip{padding:16px 20px 0;}
  .low-strip-title{display:flex; align-items:center; gap:6px; margin-bottom:8px; color:var(--red); font-size:11px; letter-spacing:0.05em;}
  .low-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .low-chip{
    flex-shrink:0; background:var(--red-bg-soft); border:1px solid var(--red-border);
    border-radius:10px; padding:8px 12px; text-align:left; cursor:pointer;
    font: inherit; color:inherit;
  }
  .low-chip .name{font-size:13px; font-weight:500; max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .low-chip .row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px;}
  .low-chip .qty{font-size:12px; color:var(--red); font-weight:600;}

  /* Item list */
  #list{padding:20px 20px 0; display:flex; flex-direction:column; gap:10px;}
  .empty{text-align:center; padding:64px 0; color:var(--text-dim); font-size:15px;}
  .item-card{
    border-radius:16px; padding:16px; border:1px solid var(--card-border); background:var(--card);
  }
  .item-card.low{background:var(--card-low); border-color:var(--card-low-border);}
  .item-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .item-info{flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; font:inherit; color:inherit; cursor:pointer;}
  .item-name-row{display:flex; align-items:center; gap:6px;}
  .item-name{font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-min{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-faint); margin-top:2px;}
  .item-min.low{color:#A83A47;}
  .item-supplier{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-dim); margin-top:4px;}
  .item-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .icon-btn{
    width:44px; height:44px; border-radius:12px; border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-decoration:none; flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.9);}
  .icon-btn.minus{background:var(--coral-bg); color:var(--coral);}
  .icon-btn.plus{background:var(--teal-bg); color:var(--teal);}
  .icon-btn.call{background:var(--teal-bg); color:var(--teal);}
  .icon-btn.line{background:var(--line-bg); color:var(--line);}
  .icon-btn.link{background:var(--link-bg); color:var(--link);}
  .icon-btn.transfer{background:var(--amber-bg); color:var(--amber);}
  .icon-btn:disabled{opacity:.3;}
  .qty-display{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; width:48px; text-align:center;}
  .qty-display.low{color:var(--red);}

  /* Activity */
  #activity{padding:32px 20px 0;}
  .activity-title{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); letter-spacing:0.05em; margin-bottom:8px;}
  .activity-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--divider); font-size:13px;}
  .activity-left{display:flex; align-items:center; gap:8px; color:var(--text-dim);}
  .activity-left span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;}
  .activity-right{font-family:'IBM Plex Mono',monospace; color:var(--text-faint);}

  /* Staff / roster view */
  #staffView{padding:16px 20px 0;}
  .roster-head{margin-bottom:16px;}
  .roster-field{margin-bottom:10px;}
  .roster-field label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint);
    letter-spacing:0.05em; margin-bottom:6px;
  }
  .roster-field input{
    width:100%; background:var(--input); border:1px solid var(--input-border); border-radius:10px;
    padding:10px 12px; font-size:13px; color:var(--text); outline:none;
  }
  .roster-table-wrap{
    overflow-x:auto; border-radius:16px; border:1px solid var(--card-border); background:var(--card); margin-bottom:16px;
  }
  table.roster-table{border-collapse:collapse; width:100%; min-width:720px;}
  .roster-table th, .roster-table td{border-bottom:1px solid var(--divider); text-align:center; font-size:12px;}
  .roster-table th{
    background:var(--bg-alt); color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-weight:600;
    padding:10px 8px; font-size:10px; letter-spacing:.03em; white-space:nowrap;
  }
  .roster-name-col{
    position:sticky; left:0; z-index:2; background:var(--card);
    min-width:104px; text-align:left; padding:10px 12px; font-weight:600; cursor:pointer;
    border-right:1px solid var(--card-border);
  }
  th.roster-name-col{background:var(--bg-alt); z-index:3;}
  .roster-pos-col{min-width:96px; text-align:left; padding:10px 10px; color:var(--text-dim); cursor:pointer;}
  .roster-store-col{min-width:64px; color:var(--text-dim); cursor:pointer;}
  .day-cell{min-width:66px; padding:4px;}
  .day-btn{
    width:100%; height:44px; border-radius:8px; border:none; font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--text);
  }
  .day-btn.cat-none{background:var(--bg-alt); color:var(--text-faint);}
  .day-btn.cat-prep{background:var(--cat-prep);}
  .day-btn.cat-cashier{background:var(--cat-cashier);}
  .day-btn.cat-bar{background:var(--cat-bar);}
  .day-btn.cat-s2{background:var(--cat-s2);}
  .day-btn.cat-off{background:var(--bg-alt); color:var(--red);}
  .roster-legend{display:flex; flex-wrap:wrap; gap:12px; margin:4px 0 20px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .legend-swatch{width:16px; height:16px; border-radius:5px; flex-shrink:0;}
  .legend-swatch.cat-none{background:var(--bg-alt); border:1px solid var(--card-border);}
  .legend-swatch.cat-prep{background:var(--cat-prep);}
  .legend-swatch.cat-cashier{background:var(--cat-cashier);}
  .legend-swatch.cat-bar{background:var(--cat-bar); border:1px solid var(--card-border);}
  .legend-swatch.cat-s2{background:var(--cat-s2);}
  .legend-swatch.cat-off{background:var(--bg-alt); border:1px solid var(--card-border);}
  .btn-secondary{
    width:100%; padding:13px; border-radius:12px; background:var(--bg-alt); border:1px solid var(--input-border);
    color:var(--text-dim); font-size:13px; font-family:'IBM Plex Mono',monospace; cursor:pointer; margin-bottom:24px;
  }
  .cat-picker{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-pill{
    padding:9px 14px; border-radius:999px; border:2px solid transparent; font-size:13px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; color:var(--text);
  }
  .cat-pill.selected{border-color:var(--text);}
  .cat-pill.cat-none{background:var(--bg-alt); color:var(--text-faint);}
  .cat-pill.cat-prep{background:var(--cat-prep);}
  .cat-pill.cat-cashier{background:var(--cat-cashier);}
  .cat-pill.cat-bar{background:var(--cat-bar);}
  .cat-pill.cat-s2{background:var(--cat-s2);}
  .cat-pill.cat-off{background:var(--bg-alt); color:var(--red);}
  .cat-pill.item-cat-ingredients{background:var(--item-cat-ingredients);}
  .cat-pill.item-cat-packing{background:var(--item-cat-packing);}
  .cat-pill.item-cat-other{background:var(--item-cat-other);}
  .item-card.warn{background:var(--amber-bg); border-color:var(--amber-border);}
  .item-min.warn{color:var(--amber);}
  .qty-display.warn{color:var(--amber);}
  .low-badge.warn-badge{background:var(--amber-bg); color:var(--amber);}
  .report-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--divider); font-size:14px;}
  .report-row:last-child{border-bottom:none;}
  .report-name{font-weight:500;}
  .report-qty{font-family:'IBM Plex Mono',monospace; color:var(--text-dim); font-size:12.5px; text-align:right;}
  .report-qty b{color:var(--text); font-size:15px;}
  .report-missing{color:var(--text-faint); font-style:italic; font-size:13px;}
  .cloud-status{
    display:flex; align-items:center; gap:6px; margin:10px 0 2px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--text-faint);
  }
  .cloud-status .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .cloud-status.online .dot{background:var(--teal-strong);}
  .cloud-status.offline .dot{background:var(--red);}
  .cloud-status.online .label{color:var(--teal-strong);}
  .cloud-status.offline .label{color:var(--red);}
  .list-section-title{
    display:flex; align-items:center; gap:8px; margin:22px 0 10px; padding:0 2px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--text-dim);
  }
  .list-section-title:first-child{margin-top:4px;}
  .list-section-title .count{color:var(--text-faint);}
  .list-section-title::after{content:''; flex:1; height:1px; background:var(--divider);}
  .item-cat-badge{
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; margin-right:6px;
    font-family:'IBM Plex Mono',monospace; vertical-align:middle;
  }
  .item-cat-badge.item-cat-ingredients{background:var(--item-cat-ingredients);}
  .item-cat-badge.item-cat-packing{background:var(--item-cat-packing);}
  .item-cat-badge.item-cat-other{background:var(--item-cat-other);}

  /* Tab bar */
  #tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:35;
    background:var(--card); border-top:1px solid var(--divider);
    display:flex; padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    background:none; border:none; border-right:1px solid var(--divider);
    color:var(--text-faint); font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.03em; cursor:pointer; padding:8px 0;
  }
  .tab-btn:last-child{border-right:none;}
  .tab-btn .icon{
    width:38px; height:32px; border-radius:10px;
    background:var(--bg-alt); color:var(--text-faint);
    transition:background .15s, color .15s;
  }
  .tab-btn.active{color:var(--teal-strong);}
  .tab-btn.active .icon{background:var(--teal-strong); color:#122320;}
  .tab-btn:active .icon{transform:scale(0.92);}

  /* FAB */
  #fab{
    position:fixed; bottom:92px; right:20px; width:56px; height:56px; border-radius:999px;
    background:var(--teal-strong); color:#122320; border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); cursor:pointer; z-index:30;
  }
  #fab:active{transform:scale(0.9);}

  /* Toast */
  #toast{
    position:fixed; bottom:156px; left:50%; transform:translateX(-50%);
    background:var(--card-border); color:var(--text); padding:10px 16px; border-radius:999px;
    font-size:13px; z-index:40; white-space:nowrap; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.15);
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.5);
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  @media(min-width:640px){ .overlay{align-items:center;} }
  .modal{
    width:100%; max-width:480px; background:var(--modal-bg); border:1px solid var(--modal-border);
    border-radius:24px 24px 0 0; padding:24px 24px 32px; max-height:90vh; overflow-y:auto;
  }
  @media(min-width:640px){ .modal{border-radius:16px;} }
  .modal-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:24px;}
  .modal-head h2{font-size:18px; font-weight:600; margin:0;}
  .close-btn{width:36px; height:36px; border-radius:999px; background:var(--card-border); border:none; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;}
  .field{margin-bottom:16px;}
  .field label{
    display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); letter-spacing:0.05em; margin-bottom:6px;
  }
  .field label.amber{color:var(--amber);}
  .field label.line-label{color:var(--line);}
  .field label.link-label{color:var(--link);}
  .field input{
    width:100%; background:var(--input); border:1px solid var(--input-border); border-radius:12px;
    padding:12px 14px; font-size:15px; color:var(--text); outline:none;
  }
  .field input.amber-border{border-color:var(--amber-border);}
  .field.mono input{font-family:'IBM Plex Mono',monospace;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .divider-block{border-top:1px solid var(--divider); margin-top:8px; padding-top:16px;}
  .section-label{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); letter-spacing:0.05em; margin-bottom:12px;}
  .modal-actions{display:flex; gap:10px; margin-top:28px;}
  .btn-delete{width:48px; height:48px; flex-shrink:0; border-radius:12px; background:var(--coral-bg); color:var(--coral); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .btn-save{flex:1; height:48px; border-radius:12px; background:var(--teal-strong); color:#122320; font-size:15px; font-weight:600; border:none; cursor:pointer;}
  .btn-save:disabled{opacity:.4;}
  #mondayBanner{
    display:none; align-items:center; gap:10px; margin:12px 20px 0;
    background:var(--coral-bg); border:1px solid var(--amber-border); border-radius:14px;
    padding:12px 14px; color:var(--coral);
  }
  #mondayBanner.show{display:flex;}
  #mondayBanner .mb-text{flex:1; font-size:13px; font-weight:600; line-height:1.4;}
  #mondayBanner .mb-go{
    background:var(--coral); color:#fff; border:none; border-radius:10px; padding:9px 14px;
    font-size:13px; font-weight:600; font-family:'IBM Plex Mono',monospace; cursor:pointer; white-space:nowrap;
  }
  #mondayBanner .mb-close{
    background:none; border:none; color:var(--coral); cursor:pointer; padding:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1 class="font-display">Matcha People - Ari</h1>
      <p class="subtitle font-mono" id="subtitle">STOCK LEDGER · 0 รายการ</p>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div id="lowBadgeWrap"></div>
      <button class="icon-btn" id="reportBtn" style="background:var(--bg-alt); color:var(--text-dim); width:40px; height:40px;" aria-label="รายงานผงมัทฉะ"></button>
    </div>
  </div>
  <div class="cloud-status" id="cloudStatus"><span class="dot"></span><span class="label">กำลังเชื่อมต่อ...</span></div>
  <div class="search-wrap" id="searchWrap">
    <span class="icon" id="searchIcon"></span>
    <input id="search" placeholder="ค้นหาสินค้า…" />
  </div>
</header>

<div id="mondayBanner">
  <span class="mb-text">วันนี้วันจันทร์ — ถึงเวลาทำรายงานผงมัทฉะประจำสัปดาห์</span>
  <button class="mb-go" id="mondayBannerGo">ดูรายงาน</button>
  <button class="mb-close" id="mondayBannerClose" aria-label="ปิด"></button>
</div>

<div id="storeStockView">
  <div id="lowStrip"></div>
  <div id="list"></div>
  <div id="activity"></div>
</div>

<div id="staffView" style="display:none;">
  <div class="roster-head">
    <div class="roster-field">
      <label>ชื่อร้าน / สาขา</label>
      <input id="rStoreLabel" placeholder="เช่น STORE 1: ARI" />
    </div>
    <div class="roster-field">
      <label>สัปดาห์ที่ (วันที่)</label>
      <input id="rDateRange" placeholder="เช่น 17 - 23 Aug" />
    </div>
    <div class="roster-field" style="margin-bottom:0;">
      <label>หมายเหตุรหัสกะ</label>
      <input id="rShiftNote" placeholder="เช่น 7(เปิด)=07:00-16:00  8.3(ปิด)=08:30-17:30" />
    </div>
  </div>

  <div class="roster-table-wrap">
    <table class="roster-table" id="rosterTable"></table>
  </div>

  <div class="roster-legend" id="rosterLegend"></div>

  <button class="btn-secondary" id="resetWeekBtn">เริ่มสัปดาห์ใหม่ (ล้างตารางกะ)</button>
</div>

<nav id="tabbar">
  <button class="tab-btn" data-tab="store"><span class="icon"></span><span>Store</span></button>
  <button class="tab-btn" data-tab="stock"><span class="icon"></span><span>Stock</span></button>
  <button class="tab-btn" data-tab="staff"><span class="icon"></span><span>Staff</span></button>
</nav>

<button id="fab" aria-label="เพิ่ม"></button>
<div id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">

function loadItems() {
  let arr;
  const raw = localStorage.getItem(ITEMS_KEY);
  if (raw === null && !localStorage.getItem(SEEDED_KEY)) {
    // first-ever load on this device/browser: seed the starter product list
    const seedList = [
      ...DEFAULT_INGREDIENTS.map(name => ({ name, category: 'ingredients' })),
      ...DEFAULT_PACKING.map(name => ({ name, category: 'packing' })),
    ];
    arr = seedList.map(s => ({
      id: uid(), name: s.name, category: s.category, qtyFront: 0, qtyBack: 0, minQty: 0, unit: 'ชิ้น',
      supplierName: '', supplierPhone: '', supplierLine: '', supplierLink: ''
    }));
    localStorage.setItem(SEEDED_KEY, 'true');
    localStorage.setItem(ITEMS_KEY, JSON.stringify(arr));
  } else {
    try { arr = JSON.parse(raw) || []; } catch(e){ arr = []; }
  }
  // migrate old single-qty items to หน้าร้าน/คลัง split, and add category if missing
  arr.forEach(it => {
    if (it.qtyFront === undefined || it.qtyBack === undefined) {
      it.qtyFront = it.qty ?? 0;
      it.qtyBack = 0;
      delete it.qty;
    }
    if (it.category === undefined) it.category = 'other';
  });
  return arr;
}
function totalQty(it) { return (it.qtyFront || 0) + (it.qtyBack || 0); }

function loadLog() {

}

function buildLineHref(value) {
  const v = value.trim();
  if (v.startsWith('http://') || v.startsWith('https://')) return v;
  const id = v.replace(/^@/, '');
  return `https://line.me/ti/p/~${id}`;
}

function setCloudStatus(state, label) {
  const el = document.getElementById('cloudStatus');
  if (!el) return;
  el.classList.remove('online', 'offline');
  if (state) el.classList.add(state);
  el.querySelector('.label').textContent = label;
}

function applyCloudSnapshot(data) {
  applyingCloudSnapshot = true;
  if (Array.isArray(data.items)) { items = data.items; localStorage.setItem(ITEMS_KEY, JSON.stringify(items)); }
  if (Array.isArray(data.log)) { log = data.log; localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
  if (Array.isArray(data.staffList)) { staffList = data.staffList; localStorage.setItem(STAFF_KEY, JSON.stringify(staffList)); }
  if (data.rosterMeta) { rosterMeta = data.rosterMeta; localStorage.setItem(ROSTER_META_KEY, JSON.stringify(rosterMeta)); }
  applyingCloudSnapshot = false;
  render();
}

function pushToCloud() {
  if (!cloudDocRef) return;
  cloudDocRef.set({
    items, log: log.slice(0, 40), staffList, rosterMeta,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => {
    console.warn('cloud push failed', err);
    setCloudStatus('offline', 'ออฟไลน์ · บันทึกในเครื่องนี้เท่านั้น');
  });
}

function queueCloudPush() {
  if (!cloudDocRef || applyingCloudSnapshot) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 400);
}

function initCloudSync() {
  if (typeof firebase === 'undefined') {
    setCloudStatus('offline', 'ออฟไลน์ · บันทึกในเครื่องนี้เท่านั้น');
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    cloudDocRef = db.collection('matcha-store').doc('main');
    cloudDocRef.onSnapshot((snap) => {
      if (snap.exists) {
        applyCloudSnapshot(snap.data() || {});
      } else {
        // very first time ever: no shared data yet, push what we have (seeded defaults) so it becomes the shared copy
        pushToCloud();
      }
      setCloudStatus('online', 'ออนไลน์ · ซิงก์ข้ามเครื่องแล้ว');
    }, (err) => {
      console.warn('cloud sync error', err);
      setCloudStatus('offline', 'ออฟไลน์ · บันทึกในเครื่องนี้เท่านั้น');
    });
  } catch (e) {
    console.warn('firebase init failed', e);
    setCloudStatus('offline', 'ออฟไลน์ · บันทึกในเครื่องนี้เท่านั้น');
  }
}

/* ---------- Render: Store / Stock ---------- */
function itemCardHtml(it, locKey, locCode) {
  const total = totalQty(it);
  const isLow = total <= it.minQty; // red: even the warehouse can't cover it — need to order
  const locQty = it[locKey] || 0;
  // yellow: only the store front is low, but the warehouse still has stock to move over
  const isFrontWarn = !isLow && locCode === 'Front' && locQty <= it.minQty && (it.qtyBack || 0) > 0;
  const stateClass = isLow ? 'low' : (isFrontWarn ? 'warn' : '');

  let alertBtn = '';
  if (isLow) {
    alertBtn = `<button type="button" class="icon" style="color:var(--red); background:none; border:none; padding:0; cursor:pointer;" data-contact="${it.id}" aria-label="แจ้งเตือน ติดต่อผู้จัดจำหน่าย">${ICONS.alert(14)}</button>`;
  } else if (isFrontWarn) {
    alertBtn = `<span class="icon" style="color:var(--amber)">${ICONS.alert(14)}</span>`;
  }

  let stateNote = '';
  if (isLow) stateNote = ' · ใกล้หมด (คลังก็ไม่พอ)';
  else if (isFrontWarn) stateNote = ' · หน้าร้านใกล้หมด มีของในคลัง';

  return `
      <div class="item-card ${stateClass}">
        <div class="item-top">
          <button class="item-info" data-edit="${it.id}">
            <div class="item-name-row">
              <span class="item-name">${esc(it.name)}</span>
              ${alertBtn}
            </div>
            <div class="item-min font-mono ${stateClass}">ขั้นต่ำ ${it.minQty} ${esc(it.unit)} · รวมทั้งหมด ${total}${stateNote}</div>
            ${it.supplierName ? `<div class="item-supplier">${ICONS.store(11)}<span>${esc(it.supplierName)}</span></div>` : ''}
          </button>
          <div class="item-actions">
            ${it.supplierPhone ? `<a class="icon-btn call" href="tel:${esc(it.supplierPhone)}" aria-label="โทรสั่งของ">${ICONS.phone()}</a>` : ''}
            ${it.supplierLine ? `<a class="icon-btn line" href="${esc(buildLineHref(it.supplierLine))}" target="_blank" rel="noopener noreferrer" aria-label="เปิด LINE">${ICONS.chat()}</a>` : ''}
            ${it.supplierLink ? `<a class="icon-btn link" href="${esc(it.supplierLink)}" target="_blank" rel="noopener noreferrer" aria-label="เปิดลิงก์สั่งของ">${ICONS.link()}</a>` : ''}
            <button class="icon-btn transfer" data-transfer="${it.id}" aria-label="ย้ายสินค้า">${ICONS.swap()}</button>
            <button class="icon-btn minus" data-adjust="${it.id}" data-loc="${locCode}" data-delta="-1" ${locQty<=0?'disabled':''}>${ICONS.minus()}</button>
            <div class="qty-display ${stateClass}">${locQty}</div>
            <button class="icon-btn plus" data-adjust="${it.id}" data-loc="${locCode}" data-delta="1">${ICONS.plus()}</button>
          </div>
        </div>
      </div>`;
}
function renderStock() {
  const locKey = activeTab === 'store' ? 'qtyFront' : 'qtyBack';
  const locCode = activeTab === 'store' ? 'Front' : 'Back';

  const lowItems = items.filter(it => totalQty(it) <= it.minQty);
  const warnItems = activeTab === 'store'
    ? items.filter(it => totalQty(it) > it.minQty && (it.qtyFront || 0) <= it.minQty && (it.qtyBack || 0) > 0)

  document.getElementById('subtitle').textContent = activeTab === 'store'
    ? `หน้าร้าน · ${items.length} รายการ`

  const badgeWrap = document.getElementById('lowBadgeWrap');
  badgeWrap.innerHTML = `
      ${lowItems.length ? `<div class="low-badge">${ICONS.alert(15)}<span class="font-mono">${lowItems.length}</span></div>` : ''}
      ${warnItems.length ? `<div class="low-badge warn-badge">${ICONS.alert(15)}<span class="font-mono">${warnItems.length}</span></div>` : ''}
    `;

  const stripEl = document.getElementById('lowStrip');
  let stripHtml = '';
  if (lowItems.length && query === '') {
    stripHtml += `
      <div class="low-strip-title font-mono">${ICONS.alert(13)}<span>ใกล้หมด (รวมทั้งสองที่)</span></div>
      <div class="low-chips">
        ${lowItems.map(it => `
          <button class="low-chip" data-edit="${it.id}">
            <div class="name">${esc(it.name)}</div>
            <div class="row">
              <div class="qty font-mono">${totalQty(it)} ${esc(it.unit)}</div>
              ${(it.supplierPhone || it.supplierLine || it.supplierLink) ? ICONS.phone(12) : ''}
            </div>
          </button>
        `).join('')}
      </div>`;
  }
  if (warnItems.length && query === '') {
    stripHtml += `
      <div class="low-strip-title font-mono" style="color:var(--amber);">${ICONS.alert(13)}<span>หน้าร้านใกล้หมด · ย้ายจากคลังได้เลย</span></div>
      <div class="low-chips">
        ${warnItems.map(it => `
          <button class="low-chip" style="background:var(--amber-bg); border-color:var(--amber-border);" data-transfer="${it.id}">
            <div class="name">${esc(it.name)}</div>
            <div class="row">
              <div class="qty font-mono" style="color:var(--amber);">หน้าร้าน ${it.qtyFront||0} · คลัง ${it.qtyBack||0}</div>
            </div>
          </button>
        `).join('')}
      </div>`;
  }
  stripEl.innerHTML = stripHtml;

  const filtered = items.filter(it => it.name.toLowerCase().includes(query.trim().toLowerCase()));
  const listEl = document.getElementById('list');
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty">
        <div class="icon" style="margin:0 auto 12px;">${ICONS.package(36,'var(--card-border)')}</div>
        <p>${items.length === 0 ? 'ยังไม่มีสินค้าในคลัง เริ่มเพิ่มรายการแรกกันเลย' : 'ไม่พบสินค้าที่ค้นหา'}</p>
      </div>`;
  } else {
    listEl.innerHTML = ITEM_CATEGORIES.map(c => {
      const groupItems = filtered.filter(it => (it.category || 'other') === c.key);
      if (!groupItems.length) return '';
      return `
        <div class="list-section-title"><span>${c.label}</span><span class="count font-mono">${groupItems.length}</span></div>
        ${groupItems.map(it => itemCardHtml(it, locKey, locCode)).join('')}
      `;
    }).join('');
  }

  const actEl = document.getElementById('activity');
  if (log.length && query === '') {
    actEl.innerHTML = `
      <div class="activity-title">กิจกรรมล่าสุด</div>
      ${log.slice(0,6).map(l => `
        <div class="activity-row">
          <div class="activity-left">${l.delta>0?ICONS.up(13,'var(--teal)'):ICONS.down(13,'var(--coral)')}<span>${esc(l.name)}</span></div>
          <div class="activity-right font-mono">${l.delta>0?'+':''}${l.delta} → ${l.qtyAfter}</div>
        </div>
      `).join('')}
    `;
  } else {
    actEl.innerHTML = '';
  }
}

function adjustStock(id, loc, delta) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  const key = loc === 'Front' ? 'qtyFront' : 'qtyBack';
  const locLabel = loc === 'Front' ? 'หน้าร้าน' : 'คลัง';
  const wasLow = totalQty(it) <= it.minQty;
  it[key] = Math.max(0, (it[key] || 0) + delta);
  const newTotal = totalQty(it);
  const nowLow = newTotal <= it.minQty;
  saveItems(items);
  log.unshift({ id: uid(), itemId: id, name: `${it.name} (${locLabel})`, delta, qtyAfter: it[key], time: new Date().toISOString() });
  saveLog(log);
  if (!wasLow && nowLow) showToast(`⚠️ "${it.name}" ใกล้หมดแล้ว`);
  render();
}

// Red alert tap: jump straight into the best available way to reach the supplier.
function contactSupplier(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  if (it.supplierLine) { window.open(buildLineHref(it.supplierLine), '_blank', 'noopener'); return; }
  if (it.supplierPhone) { window.location.href = `tel:${it.supplierPhone}`; return; }
  if (it.supplierLink) { window.open(it.supplierLink, '_blank', 'noopener'); return; }
  showToast('ยังไม่ได้ใส่ช่องทางติดต่อผู้จัดจำหน่ายของสินค้านี้');
  openModal(id);
}

function deleteItem(id) {
  const it = items.find(x => x.id === id);
  items = items.filter(x => x.id !== id);
  saveItems(items);
  showToast(it ? `ลบ "${it.name}" แล้ว` : 'ลบแล้ว');
  render();
}

  // suggest just enough to bring the store front back up to its minimum, capped by what's in the warehouse
  const needed = Math.max(0, it.minQty - (it.qtyFront || 0));
  const suggested = needed > 0 ? Math.min(needed, it.qtyBack || 0) : 0;
  document.getElementById('tfQty').value = suggested > 0 ? String(suggested) : '';

});

document.getElementById('tfQty').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '');
});

document.getElementById('transferSaveBtn').addEventListener('click', () => {
  if (!transferItemId) return;
  const it = items.find(x => x.id === transferItemId);
  if (!it) return;
  let qty = parseInt(document.getElementById('tfQty').value, 10) || 0;
  if (qty <= 0) return;

  const fromKey = transferDirection === 'toFront' ? 'qtyBack' : 'qtyFront';
  const toKey = transferDirection === 'toFront' ? 'qtyFront' : 'qtyBack';
  const fromLabel = transferDirection === 'toFront' ? 'คลัง' : 'หน้าร้าน';
  const toLabel = transferDirection === 'toFront' ? 'หน้าร้าน' : 'คลัง';

  const available = it[fromKey] || 0;
  if (qty > available) {
    qty = available;
    showToast(`ย้ายได้สูงสุดแค่ ${available} ${it.unit} (${fromLabel}มีไม่พอ)`);
  }
  if (qty <= 0) { closeTransferModal(); return; }

  const wasLow = totalQty(it) <= it.minQty;
  it[fromKey] = Math.max(0, available - qty);
  it[toKey] = (it[toKey] || 0) + qty;
  const nowLow = totalQty(it) <= it.minQty;
  saveItems(items);

  log.unshift({ id: uid(), itemId: it.id, name: `${it.name} (ย้าย ${fromLabel}→${toLabel})`, delta: qty, qtyAfter: it[toKey], time: new Date().toISOString() });
  saveLog(log);

  showToast(`ย้าย "${it.name}" ${qty} ${it.unit} จาก${fromLabel}ไป${toLabel}แล้ว`);
  if (!wasLow && nowLow) showToast(`⚠️ "${it.name}" ใกล้หมดแล้ว`);
  closeTransferModal();
  render();
});

/* ---------- Report: matcha powder stock ---------- */
const reportOverlay = document.getElementById('reportOverlay');
function reportLineFor(name) {
  const it = items.find(x => x.name.trim() === name.trim());
  if (!it) return { it: null, text: `${name}: ยังไม่มีในระบบ` };
  return { it, text: `${it.name}: หน้าร้าน ${it.qtyFront||0} / คลัง ${it.qtyBack||0} / รวม ${totalQty(it)} ${it.unit}` };
}
function renderReportList() {
  const wrap = document.getElementById('reportList');
  wrap.innerHTML = REPORT_ITEMS.map(name => {
    const { it } = reportLineFor(name);
    if (!it) {
      return `<div class="report-row"><span class="report-name">${esc(name)}</span><span class="report-missing">ยังไม่มีในระบบ</span></div>`;
    }
    return `<div class="report-row">
      <span class="report-name">${esc(it.name)}</span>
      <span class="report-qty">หน้าร้าน ${it.qtyFront||0} · คลัง ${it.qtyBack||0}<br>รวม <b>${totalQty(it)} ${esc(it.unit)}</b></span>
    </div>`;
  }).join('');
}
function openReportModal() { renderReportList(); reportOverlay.classList.add('open'); }
function closeReportModal() { reportOverlay.classList.remove('open'); }
document.getElementById('reportBtn').addEventListener('click', openReportModal);
document.getElementById('closeReportModal').addEventListener('click', closeReportModal);
document.getElementById('reportCopyBtn').addEventListener('click', () => {
  const text = `รายงานผงมัทฉะ (${new Date().toLocaleDateString('th-TH')})\n` +
    REPORT_ITEMS.map(name => reportLineFor(name).text).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('คัดลอกรายงานแล้ว')).catch(() => showToast('คัดลอกไม่สำเร็จ'));
  } else {
    showToast('คัดลอกไม่สำเร็จ (เบราว์เซอร์ไม่รองรับ)');
  }
});

/* ---------- Monday reminder banner: nudge to do the weekly matcha powder report ---------- */
const MONDAY_DISMISS_KEY = 'matcha-monday-banner-dismissed';
function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function checkMondayBanner() {
  const banner = document.getElementById('mondayBanner');
  const today = new Date();
  const isMonday = today.getDay() === 1;
  const dismissedToday = localStorage.getItem(MONDAY_DISMISS_KEY) === dateKey(today);
  banner.classList.toggle('show', isMonday && !dismissedToday);
}
document.getElementById('mondayBannerGo').addEventListener('click', () => { openReportModal(); });
document.getElementById('mondayBannerClose').addEventListener('click', () => {
  localStorage.setItem(MONDAY_DISMISS_KEY, dateKey(new Date()));
  document.getElementById('mondayBanner').classList.remove('show');
});

/* ---------- Roster meta fields ---------- */
const rosterFieldMap = { rStoreLabel:'storeLabel', rDateRange:'dateRange', rShiftNote:'shiftNote' };
Object.keys(rosterFieldMap).forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => {
    rosterMeta[rosterFieldMap[id]] = e.target.value;
    saveRosterMeta(rosterMeta);
    if (id === 'rDateRange') {
      document.getElementById('subtitle').textContent = `STAFF ROSTER · ${rosterMeta.dateRange || 'สัปดาห์นี้'}`;
    }
  });
});

document.getElementById('resetWeekBtn').addEventListener('click', () => {
  if (!confirm('ล้างตารางกะทั้งหมดของสัปดาห์นี้? (ชื่อพนักงาน/ตำแหน่งจะไม่หาย)')) return;
  staffList.forEach(s => { s.days = emptyDays(); });
  saveStaff(staffList);
  showToast('เริ่มสัปดาห์ใหม่แล้ว');
  render();
});

/* ---------- FAB ---------- */
document.getElementById('fab').addEventListener('click', () => {
  if (activeTab === 'staff') openStaffModal(null);
  else openModal(null);
});

/* ---------- Event delegation for list / table clicks ---------- */
document.body.addEventListener('click', (e) => {
  const editTarget = e.target.closest('[data-edit]');
  if (editTarget) { openModal(editTarget.getAttribute('data-edit')); return; }

  const adjustTarget = e.target.closest('[data-adjust]');
  if (adjustTarget) {
    const id = adjustTarget.getAttribute('data-adjust');
    const loc = adjustTarget.getAttribute('data-loc');
    const delta = parseInt(adjustTarget.getAttribute('data-delta'), 10);
    adjustStock(id, loc, delta);
    return;
  }

  const transferTarget = e.target.closest('[data-transfer]');
  if (transferTarget) { openTransferModal(transferTarget.getAttribute('data-transfer')); return; }

  const contactTarget = e.target.closest('[data-contact]');
  if (contactTarget) { contactSupplier(contactTarget.getAttribute('data-contact')); return; }

  const staffEditTarget = e.target.closest('[data-staff-edit]');
  if (staffEditTarget) { openStaffModal(staffEditTarget.getAttribute('data-staff-edit')); return; }

  const dayEditTarget = e.target.closest('[data-day-edit]');
  if (dayEditTarget) {
    openDayModal(dayEditTarget.getAttribute('data-day-edit'), dayEditTarget.getAttribute('data-day-key'));
    return;
  }
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value;
  render();
});

setTab('store');
initCloudSync();
checkMondayBanner();
</script>
